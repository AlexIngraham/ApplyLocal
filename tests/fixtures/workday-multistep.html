<main data-automation-id="applicationPage">
  <div data-automation-id="jobApplication">
    <section id="workday-step" data-automation-id="contactInformationPage">
      <h2>Contact Information</h2>
      <label for="step-email">Email Address</label>
      <input id="step-email" data-automation-id="emailAddress" type="email" />
    </section>
  </div>
  <template id="education-step-template">
    <section data-automation-id="educationPage">
      <h2>Education</h2>
      <label for="step-school">School</label>
      <input id="step-school" data-automation-id="school" />
      <label for="step-major">Field of Study</label>
      <input id="step-major" data-automation-id="fieldOfStudy" />
    </section>
  </template>
</main>
