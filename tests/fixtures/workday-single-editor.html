<main data-automation-id="applicationPage">
  <section data-automation-id="workExperienceSection" aria-labelledby="experience-heading">
    <h2 id="experience-heading">Work Experience</h2>
    <div id="summaries"></div>
    <button type="button">Add Another</button>
    <div data-automation-id="workExperienceEditor">
      <label>Company <input data-automation-id="company"></label>
      <label>Job Title <input data-automation-id="jobTitle"></label>
      <label>From <input data-automation-id="startDate" type="month"></label>
      <label>To <input data-automation-id="endDate" type="month"></label>
      <label>Location <input data-automation-id="location"></label>
    </div>
  </section>
</main>
